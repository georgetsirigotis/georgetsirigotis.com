name: Update security feeds

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-security-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh pruned CISA feed
        run: node scripts/update-cisa-feed.mjs

      - name: Refresh pruned The Hacker News feed
        run: node scripts/update-thn-vulnerabilities.mjs

      - name: Commit feed updates
        run: |
          if git diff --quiet -- assets/cisa-updates.json assets/thn-vulnerabilities.json; then
            echo "No security feed changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cisa-updates.json assets/thn-vulnerabilities.json
          git commit -m "Update security feeds"
          git push
